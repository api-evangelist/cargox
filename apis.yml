  fintech listed on Hiive. It is NOT CargoX of Slovenia (cargox.io / cargox.digital),
  the blockchain document transfer / electronic bill of lading company, which does
  publish a public REST API, Swagger schemas and a Postman collection at developer.cargox.digital.
