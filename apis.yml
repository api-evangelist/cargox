aid: cargox
name: Cargo X
description: 'Cargo X (CargoX) is a Sao Paulo based Brazilian logistics technology
  and fintech company, founded in 2013, that operates one of Brazil''s largest digital
  freight marketplaces - matching shippers (embarcadores) with carriers (transportadoras)
  and independent truck drivers. Beyond freight brokerage the platform provides dedicated
  freight desk operations, driver qualification and real-time cargo monitoring, automated
  issuance of Brazilian transport tax documents (CT-e and MDF-e), cargo insurance,
  receivables financing and working-capital credit for carriers, and green-freight
  / ESG programs that reduce empty return trips. The company reached unicorn status
  with a USD 200M Series F in October 2021 co-led by Tencent and SoftBank, with Valor
  Capital Group, Lightrock and Oikos participating.'
